name: Validate Editor Pull Request

on:
  pull_request:
    branches: [ main ]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40

      - name: Verify allowed paths
        # Если автор PR — НЕ nnewss, то запускаем проверку
        if: github.actor != 'nnewss'
        run: |
          echo "Проверка файлов для пользователя: ${{ github.actor }}"
          echo "Изменённые файлы: ${{ steps.changed-files.outputs.all_changed_files }}"

          # Разрешаем только папку news и файл index.json
          ALLOWED_PATTERN="^(news/|index\.json$)"
          FORBIDDEN_FILES=""

          # Проходим по всем изменённым/созданным/удалённым файлам
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if ! [[ "$file" =~ $ALLOWED_PATTERN ]]; then
              FORBIDDEN_FILES="$FORBIDDEN_FILES $file"
            fi
          done

          # Если найдены запрещенные файлы — блокируем PR
          if [[ -n "$FORBIDDEN_FILES" ]]; then
            echo "❌ Обнаружены изменения в запрещённых файлах:"
            echo "$FORBIDDEN_FILES"
            echo "Этот PR может изменять только файлы в папке 'news/' и файл 'index.json'."
            exit 1 
          else
            echo "✅ Все изменения находятся в разрешённых путях."
          fi
